<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f6f4ef">
  <title>Sudoku</title>

  <!-- Installable app (PWA) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sudoku">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <!-- Apply the saved theme before the first paint so there is no flash of the wrong colors -->
  <script>
    try {
      var t = JSON.parse(localStorage.getItem("sudoku.theme"));
      if (["paper", "ocean", "stranger", "cyberpunk"].indexOf(t) < 0) t = null;
      if (!t && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) t = "stranger";
      if (t) document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <main class="app">
    <header class="top">
      <h1>Sudoku</h1>
      <div id="themes" class="themes" role="group" aria-label="Theme"></div>
    </header>

    <div id="levels" class="levels"></div>

    <div class="info">
      <span id="levelLabel" class="chip"></span>
      <div class="stat"><small>Score</small><b id="score">0</b></div>
      <div class="stat"><small>Time</small><b id="timer" class="timer">00:00</b></div>
      <div id="lives" class="lives" aria-label="Mistakes"></div>
    </div>

    <div class="boardwrap">
      <div id="board" class="board" role="grid" aria-label="Sudoku board"></div>
      <div id="overlay" class="overlay hidden"></div>
      <div id="statsOverlay" class="overlay hidden"></div>
      <div id="confirmOverlay" class="overlay hidden"></div>
    </div>

    <div class="tools">
      <button id="undoBtn" class="tool" aria-label="Undo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg><span>Undo</span>
      </button>
      <button id="redoBtn" class="tool" aria-label="Redo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22L3.9 16c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/></svg><span>Redo</span>
      </button>
      <button id="eraseBtn" class="tool" aria-label="Erase">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-3 12.59L17.59 17 14 13.41 10.41 17 9 15.59 12.59 12 9 8.41 10.41 7 14 10.59 17.59 7 19 8.41 15.41 12 19 15.59z"/></svg><span>Erase</span>
      </button>
      <button id="draftBtn" class="tool" aria-label="Draft notes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg><span>Draft</span>
      </button>
      <button id="hintBtn" class="tool" aria-label="Hint">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7z"/></svg><span>Hint</span>
        <i id="hintCount" class="count">3</i>
      </button>
    </div>

    <div id="pad" class="pad"></div>

    <div class="row">
      <button id="newGameBtn" class="btn">New Game</button>
      <button id="restartBtn" class="btn">Restart</button>
      <button id="statsBtn" class="btn">Stats</button>
    </div>
  </main>

  <!-- Plain scripts (no modules) so the game also works when you double-click index.html -->
  <script src="js/generator.js"></script>
  <script src="js/solver.js"></script>
  <script src="js/state.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/board.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
